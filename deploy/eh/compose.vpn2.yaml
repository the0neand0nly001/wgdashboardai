name: eh-wgdashboard
services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/eh/Dockerfile.backend
    image: eh-wgdashboard-backend:local
    restart: unless-stopped
    network_mode: container:amnezia-wireguard
    environment:
      EH_NODE_TOKEN: ${EH_VPN2_TOKEN:?Set EH_VPN2_TOKEN}
      EH_PRIVATE_BRIDGE: "1"
      EH_PUBLIC_IP: 145.241.227.248
      TZ: Europe/Dublin
    volumes:
      - ${EH_WG_CONFIG_DIR:?Run prepare.py on this host}:/etc/wireguard
      - /etc/komodo/eh-wgdashboard/backend:/data
    cap_add: [NET_ADMIN, NET_RAW]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
  node:
    build:
      context: ../..
      dockerfile: deploy/eh/Dockerfile.services
    image: eh-wgdashboard-services:local
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN]
    environment:
      EH_NODE_TOKEN: ${EH_VPN2_TOKEN:?Set EH_VPN2_TOKEN}
      EH_PUBLIC_IP: 145.241.227.248
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/komodo/eh-wgdashboard/node:/data
    command: [gunicorn, -c, services_gunicorn.py, "node:app"]
    mem_limit: 192m
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
  gateway:
    image: eh-wgdashboard-services:local
    build:
      context: ../..
      dockerfile: deploy/eh/Dockerfile.services
    restart: unless-stopped
    network_mode: host
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /etc/komodo/eh-wgdashboard/gateway:/data
    environment:
      EH_ROLE: gateway
      EH_VPN1_TOKEN: ${EH_VPN1_TOKEN:?Set EH_VPN1_TOKEN}
      EH_VPN2_TOKEN: ${EH_VPN2_TOKEN:?Set EH_VPN2_TOKEN}
      EH_SESSION_SECRET: ${EH_SESSION_SECRET:?Set EH_SESSION_SECRET}
      EH_ADMIN_USERNAME: ${EH_ADMIN_USERNAME:-admin}
      EH_ADMIN_PASSWORD_HASH: ${EH_ADMIN_PASSWORD_HASH:?Run prepare.py}
    command: [gunicorn, -c, services_gunicorn.py, "gateway:app"]
    mem_limit: 192m
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
